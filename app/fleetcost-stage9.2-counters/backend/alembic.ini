# Alembic configuration for FleetCost.
#
# Migrations are applied via:  alembic upgrade head
# Generate a new migration:    alembic revision --autogenerate -m "describe change"
#
# Note: alembic reads DATABASE_URL from the env (see env.py), so this file
# does NOT contain connection details. Set DATABASE_URL in your .env file
# (postgresql+asyncpg://... for the app, postgresql://... for alembic — the
# env.py shim translates between the two).
[alembic]
script_location = alembic
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
