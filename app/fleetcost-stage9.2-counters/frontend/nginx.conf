server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Upload size ───────────────────────────────────────────────────────
    # nginx defaults to 1 MB, so any real CSV/XLSX import (Fakturownia income
    # exports, nav.by mileage dumps, Q8 truck cards) came back as 413 while the
    # backend happily accepted unlimited uploads. 25 MB covers years of data;
    # the backend (imports.py) rejects anything larger with a clear message.
    client_max_body_size 25m;

    # ── Basic hardening ───────────────────────────────────────────────────
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # This app has no inline/injected content beyond its own bundle; keep the
    # policy tight but permissive enough for the inline styles React emits.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;

    # Enable when serving over HTTPS (Cloudflare tunnel / reverse proxy):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── API ───────────────────────────────────────────────────────────────
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts — alembic migrations or sync_company can take 30s+
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # When backend is down (502/503/504), return a JSON error instead of
        # nginx's default HTML page — so the frontend can parse it and show
        # a meaningful message instead of "Unexpected token '<'".
        error_page 500 502 503 504 = @api_error;
    }

    location @api_error {
        default_type application/json;
        return 502 '{"detail":"Backend unavailable — check docker compose logs backend","status":502}';
    }

    # ── Static assets: cache the hashed bundle for a year ────────────────
    # Шрифты лежат в /assets (собственные woff2) — кэшируем надолго.
    location ~* \.woff2$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — all routes go to index.html ───────────────────────
    location / {
        # index.html must never be cached, otherwise a rebuilt frontend keeps
        # serving the old bundle from the browser cache.
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
